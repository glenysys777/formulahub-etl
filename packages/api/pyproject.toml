[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulaetl-api"
version = "0.1.0"
description = "FormulaETL FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "formulaetl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["formulaetl_api*"]
