[pytest]
testpaths = tests
pythonpath = packages/runner packages/api .
asyncio_mode = auto
markers =
    slow: optional long / high-memory tests (e.g. RUN_CSV_1M=1)
    live: LIVE_CLOUD wedge — skips unless RUN_LIVE_WEDGE=1 + credentials
    bench: LOCAL/DEMO wedge scale benches — skips unless RUN_BENCH=1
filterwarnings =
    ignore::DeprecationWarning
